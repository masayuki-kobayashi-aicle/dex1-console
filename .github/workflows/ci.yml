name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install (pyftdi and pyserial are imported by the tests, rerun by the export test; no adapter is needed)
        run: pip install -e ".[dev,espprog,rerun]"
      - name: Unit tests (mock transport only; no hand, no adapter)
        run: pytest
      - name: Protocol self-test against recorded vendor SDK frames
        run: dex1 selftest
